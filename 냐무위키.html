*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#222;font-family:Arial,"Noto Sans KR",sans-serif;font-size:14px}
a{color:#0275d8;text-decoration:none}a:hover{text-decoration:underline}

.logo{font-size:24px;font-weight:800;color:#333;white-space:nowrap}.logo span{color:#16a085}

.wrap{max-width:1120px;margin:22px auto;display:grid;grid-template-columns:1fr 250px;gap:18px}

<h2>1. 개요</h2>
<p>대한민국의 야구 선수. <a href="#" onclick="show('career');return false">롯데 자이언츠</a> 소속의 지명타자. 최연소 4번 타자 및 KBO 역대 최연소 100홈런 기록을 보유하고 있다.</p>
<p>데뷔 시즌부터 리그 정상급 타격을 선보였으며, 2025년에는 타격왕·홈런왕·타점왕·출루율왕·장타율왕을 차지하며 5관왕에 올랐다.</p>

<p>뛰어난 배트 컨트롤과 선구안, 장타력을 모두 갖춘 타자. 기본적으로 내야 전 포지션을 소화할 수 있었으며 외야수로 출장한 경험도 있으나, 햄스트링 문제와 입스 증상으로 현재는 지명타자를 중심으로 출장한다.</p>

<h2>4. 주요 기록 및 수상</h2>
<p><span class="tag">2023 신인왕</span><span class="tag">2023 외야수 골든글러브</span><span class="tag">2024 최연소 4번타자</span><span class="tag">2025 5관왕</span><span class="tag">2025 지명타자 골든글러브</span><span class="tag">KBO 최연소 100홈런</span></p>

<h2>5. 별명</h2>
<p>야돌이, 차고은, 차은탁, 개새끼, 챱츄, 게은탁, 차은우 등 다양한 별명이 있다.</p>

<h2>6. 여담</h2>
<p>등장곡과 응원가에 관련된 밈이 많은 선수로, 특히 항저우 아시안게임 금메달 이후 한 달간 사용했던 등장곡으로 인해 ‘차은탁’이라는 별명이 널리 알려졌다.</p>

<h2>7. 친분 관계</h2>
<p><a href="#" onclick="show('gwangdong');return false">광동</a>의 일원으로 김도영, 박해양과 오랜 친구 관계다. <a href="#" onclick="show('jaehyun');return false">이재현</a>과도 친분이 깊다.</p>

<div class="footnotes">

<div class="footnote-item" id="fn1"><b>[1]</b> 빠른 2004년생으로, 03년생들과 학교를 같이 다녔다. 하지만 고등학교 3학년, 햄스트링 부상으로 인하여 유급했다.</div>
<div class="footnote-item" id="fn2"><b>[2]</b> 태어나기를 부산에서 태어났지만, 한 달도 안 되어서 미국으로 유학을 갔다. 초등학교는 광주에서 자랐으며, 그 뒤로 쭉 서울에서 자랐다. 그래서 그런지 사투리가 없다. 그럼에도 차민혁은 계속 부산 출신이라고 하는 중.</div>
<div class="footnote-item" id="fn3"><b>[3]</b> 광주동성초에서 전학.</div>
<div class="footnote-item" id="fn4"><b>[4]</b> 후술할 광동의 탄생지가 바로 광주동성초이다.</div>
<div class="footnote-item" id="fn5"><b>[5]</b> 초창기에는 내야 유틸리티로 활동했지만 주 포지션은 좌익수.</div>
<div class="footnote-item" id="fn6"><b>[6]</b> 본래 내야수로 지명되었고 외야수로 출장한 적도 있었지만 입스 증상으로 완전히 지명타자로 전향했다. 기본적으로는 내야 전 포지션을 소화할 수 있고 외야전향 초창기에는 좌익수로도 출장했으나, 햄스트링 문제로 거의 지명타자로만 출장한다. 하지만 팀 상황에 따라 1루수로 출장하기도 한다. 좌익수 출장은 빅터 레이예스와 전준우로도 쓸 수 있기에 출장하는 일이 거의 없어졌다.</div>
<div class="footnote-item" id="fn7"><b>[가사]</b> 내가 떴다 하면 다 외쳐 오빠, 오빠. (최근 ‘민혁 오빠’라고 부른다.)</div>
<div class="footnote-item" id="fn8"><b>[8]</b> 9월, 우승하면 잠시 등장곡을 바꾸겠다고 공약을 걸었다. 항저우 아시안게임에서 금메달을 쟁취하고 복귀하자 단 한 달간 쓰겠다고 발표한 등장곡이다. 항저우 아시안게임 당시 홈런을 2개나 기록한 차민혁으로서는 당시 기사 제목이었던 ‘드라마 남주인공의 컴백’이라는 타이틀이 어울리는 등장곡이었다.</div>
<div class="footnote-item" id="fn9"><b>[가사2]</b> 롯데의~ 차민혁~ 파워히터 차민혁~ 거친 파도에도 굴하지 않게~ (잘!생!겼!다!차!민!혁!) 롯데의~! 차민혁~ 파워히터 차민혁~ 꽃보다 멋진 너~ 차민혁~</div>
<div class="footnote-item" id="fn10"><b>[9]</b> KIA의 감독 차범호(이범호)가 현역 시절 쓰던 등장곡이다. 차민혁도 이 응원가를 사랑했고, 제의를 받았을 때 흔쾌히 동의하여 곧 차민혁의 주 응원가로 자리잡았다. KIA와의 경기 중 차민혁의 등장 이후 KIA가 우세하는 상황이 올 때면 KIA 측에서는 ‘잘 생 겼 다 차 범 호’의 응원가를 튼다. 일종의 부자싸움.</div>
<div class="footnote-item" id="fn11"><b>[10]</b> 야구에 돌은 놈. 야구 말고는 할 줄 아는 것이 없고, 멍청해진다고 해서 지어진 별명. 실력 덕분에 좋은 뜻으로 쓰이고 있다.</div>
<div class="footnote-item" id="fn12"><b>[11]</b> 항저우 아시안게임에 우승한 후 드라마 도깨비 OST를 잠시 등장곡으로 사용해서 붙여진 별명. 이후 만들어진 도깨비 관련 밈은 전부 이 때문에 지어졌다.</div>
<div class="footnote-item" id="fn13"><b>[12]</b> 하는 행동과 더불어 외모가 강아지 같다는 뜻에서 강아지 또는 형들 사이에서는 친근하게 개새끼라고 불린다. 형들에게 붙어다니고 아부에 천부적인 재능을 가지고 있어서 붙여진 별명. 동시에 귀여움 받는다는 뜻 또한 포함되어 있다.</div>
<div class="footnote-item" id="fn14"><b>[13]</b> 차민혁의 게이 썰이 퍼지게 되면서 붙여진 별명. 한 커뮤니티에서 빠르게 삭제한 어떤 글 때문에 붙여지게 되었지만 사실이 아니다. 이 별명을 좋아하지 않는 편.</div>
<div class="footnote-item" id="fn15"><b>[14]</b> 성이 차 씨라서 붙은 별명. 차은우의 탈세 논란 이후 차은우는 가짜고, 차민혁이 진짜라고 불린다.</div>
<div class="footnote-item" id="fn16"><b>[15]</b> 차범호(77년생). 전 KIA 타이거즈 선수 및 전 KIA 타이거즈 감독이다. 아버지를 따라 KIA에 갈 것이라는 팬들과 아버지의 기대와는 다르게 어릴 때부터 롯데 자이언츠의 팬으로 자라게 되었고, 아버지에게 좋은 부분만 물려받았다. 차범호와는 다르게 말랐기 때문에 달리기 속도는 이미 아버지를 넘어섰으며, 차범호를 이어 만루의 사나이라는 타이틀 또한 보유 중이다. 같은 유격수 출신이지만 실책은 없었기 때문에 팬들 사이에서는 “자식 이기는 부모 없다”라는 말을 자주 듣는다. 동시에 차범호의 기록인 통산 장타율 0.482를 따라갈만큼의 실력을 보유하고 있다. KIA 팬들에게는 차민혁이 아픈 손가락으로, 호시탐탐 재계약 시즌 때만 되면 기대를 한다.</div>
<div class="footnote-item" id="fn17"><b>[16]</b> 외국의 모델. 아버지가 KIA 타이거즈 코치이고, 동생이 롯데 자이언츠 선수라서 매번 구단 싸움을 부추긴다고 한다. 본인은 KIA 타이거즈의 팬이다. 같은 1997년생인 김도영의 큰 누나 김혜인과 동창으로, 친구 사이다. 김도영과 술자리를 몇 번 가질 정도로 인맥을 유지하고 있다.</div>
<div class="footnote-item" id="fn18"><b>[17]</b> 서울의 모 대학병원 간호사. 집안에 야구선수가 둘이나 되지만 야구에는 전혀 관심이 없다고 한다. 가수 최예나와 장안중학교를 같이 나왔으며 현재까지 둘이 자주 만날 만큼 친하다. 이 덕분에 최예나의 시구를 차민혁이 지도했으며 ‘캐치캐치’를 추기까지 했다.</div>
<div class="footnote-item" id="fn19"><b>[18]</b> MBTI 자체를 믿지 않아서 김도영이 대신 해준 검사에서 나온 MBTI. 의외로 제일 잘 맞는다고.</div>
<div class="footnote-item" id="fn20"><b>[19]</b> Giants TV에서 잘 맞는 MBTI로는 ISFJ, ISTP, ENTP가 있다고 하자, 각 박해양, 이재현, 윤동희의 MBTI인 것을 알고 좋아하며 “이제 MBTI를 믿는다”고 했다. 자기는 없다고 삐진 김도영은 덤.</div>
<div class="footnote-item" id="fn21"><b>[20]</b> 아디다스 코리아 후원.</div>
<div class="footnote-item" id="fn22"><b>[21]</b> 한국인 야구 선수 중에서는 MLB에 진출한 이정후 외의 KBO 내 유일한 앰버서더로 활동 중이며 아디다스 코리아로부터 장비 및 야구용품을 후원받고 있다.</div>
<div class="footnote-item" id="fn23"><b>[22]</b> 레드불 코리아 후원.</div>
<div class="footnote-item" id="fn24"><b>[23]</b> 한국 구기 선수 역사상 두 번째의 후원 계약이다. 첫번째는 이정후로, 둘의 후원사가 완벽하게 겹친다.</div>
</div>`,


career:`<h1>차민혁/선수 경력</h1><div class="meta">최근 수정 시각: 2026-09-28 00:57:00</div>
<h2>1. 개요</h2>
<p>롯데 자이언츠 소속 내야수 차민혁의 선수 경력을 정리한 문서.</p>
<h2>2. 아마추어 시절</h2>
<p>휘문고등학교 재학 시절부터 차민혁은 전국 최고의 타격 유망주로 손꼽혔다. 2학년 때 고교야구 최연소 사이클링 히트를 달성하며 이름을 알렸고, 3학년 시즌에는 황금사자기 전국고교야구대회 직후까지 타율 0.643(28타수 18안타)이라는 압도적인 성적을 기록하며 고교 야구 최고의 타자로 평가받았다. 뛰어난 배트 컨트롤과 선구안, 장타력을 모두 갖춘 타자로 주목받으며 2022 KBO 신인 드래프트 최대어로 꼽혔다.</p>
<p>당시 다수의 스카우트들은 드래프트에만 나온다면 전체 1순위가 유력하다고 평가했으며, 특히 롯데와 LG가 차민혁 영입에 가장 적극적인 모습을 보였다. 고교 최고의 타격 재능이라는 평가와 함께 차세대 리그를 이끌 재목으로 기대를 모았다.</p>
<p>그러나 3학년 시즌 막판 햄스트링 3도 파열 부상을 당하며 상황이 급변했다. 재활에 상당한 시간이 필요하다는 소견이 나오면서 차민혁은 결국 2022 KBO 신인 드래프트 신청을 포기했고, 졸업을 1년 미루며 재활과 몸 상태 회복에 전념하는 선택을 했다.</p>
<p>1년간의 재활을 성공적으로 마친 차민혁은 2023 KBO 신인 드래프트에 다시 모습을 드러냈다. 부상으로 인해 우려의 시선도 있었지만, 타격 재능만큼은 의심의 여지가 없다는 평가를 받았고 결국 지명 1순위권을 가진 롯데의 지명을 받으며 전체 1순위로 프로 무대에 입성했다.</p>
<h2>3. 롯데 자이언츠</h2>
<h3>3.1. <a href="#" onclick="show('career2023');return false"><a href="#" onclick="show('career2023');return false">2023 시즌</a></a></h3>

career2023:`<h1>차민혁/선수 경력/2023년</h1><div class="meta">최근 수정 시각: 2026-09-28 00:57:00</div>
<h2>1. 개요</h2>
<p>롯데 자이언츠 소속 내야수 차민혁의 <a href="#" onclick="show('career2023');return false">2023 시즌</a>을 정리한 문서.</p>
<h2>2. <a href="#" onclick="show('career2023');return false">페넌트 레이스</a></h2>
<p>차민혁은 데뷔 첫해부터 KBO 역사에 남을 ‘<span>고졸 신인 신화</span>’를 써 내렸다. 개막전부터 주전으로 기용된 그는 신인답지 않은 타격 능력과 뛰어난 선구안, 장타력을 동시에 선보이며 단숨에 리그를 대표하는 타자로 떠올랐다. 시즌 초반에는 주로 중심 타선과 상·하위 타순을 오갔으나, 뛰어난 활약을 바탕으로 후반기에는 중심 타선에 고정되며 롯데 타선의 핵심 선수로 자리 잡았다.</p>
<p>정규시즌에서는 146경기에 출전해 134안타, 18홈런, 76타점, 73득점, 16도루, 77볼넷(3위)을 기록했다. 또한 타율 0.384(1위), 출루율 0.509(1위), 장타율 0.541(3위), OPS 1.050(1위)을 기록하며 데뷔 시즌부터 리그 정상급 성적을 남겼다.</p>
<h2>3. 시즌 후</h2>
<p>이 시즌을 통해 <span>타격왕</span>, <span>출루율왕</span>을 차지했으며, 고졸 신인으로는 이례적으로 타격 전 부문에서 최상위권에 이름을 올렸다. 특히 데뷔 첫해 타율 0.384를 기록하며 KBO <span>역대 최고의 고졸 신인 시즌 중 하나</span>라는 평가를 받았고, 뛰어난 선구안과 해결 능력으로 ‘천재 타자’, ‘괴물 신인’이라는 별명을 얻었다.</p>
<p>수비에서도 기대 이상의 활약을 펼쳤다. 주 포지션인 좌익수로 꾸준히 출전하며 여러 차례 호수비와 슈퍼캐치를 선보였고, 적극적인 주루 플레이와 안정적인 수비 능력으로 공·수 양면에서 팀에 기여했다.</p>
<p>사실상 데뷔하자마자 2007년 <span>이대호</span>에 비견되는 팀 내 지배력을 보여준 KBO 신인 역사상 손가락에 꼽히는 시즌으로, 2020년 <span>멜 로하스 주니어</span>, 2022년 <span>이정후</span>, 2024년 <span>김도영</span>의 뒤를 잇는 2020년대 KBO 리그 야수의 최고의 시즌 중 하나이자 이견의 여지가 없는 역대 최고의 신인 우타자 시즌으로 평가받는다.</p>
<h2>4. 총평</h2>
<h3>4.1. 페넌트 레이스 총평</h3>
<p>시즌 종료 후에는 압도적인 득표율로 <span>신인왕</span>을 수상했으며, 외야수 부문 <span>골든글러브</span>까지 품에 안았다. 데뷔 첫해부터 리그를 대표하는 스타로 자리매김하며 이후 롯데의 프랜차이즈 스타 시대를 여는 출발점이 된 시즌으로 평가받는다.</p>
<p>11월 24일 결국 다수의 예상대로 신인왕을 수상했으며, 94%의 압도적인 득표율을 기록했다.</p>
<p>12월 9일 외야수 전체 득표율 1등인 82.6%의 득표율로 외야수 골든글러브를 차지했다. 2000년대생 최초 MVP 수상자임과 동시에 역대 야수 최연소 MVP 수상자가 되는 영예를 안았다.</p>

<h2>1. 개요</h2>
<p>롯데 자이언츠 소속 내야수 차민혁의 <a href="#" onclick="show('career2024');return false">2024 시즌</a>을 정리한 문서.</p>
<h2>2. 페넌트 레이스</h2>
<p>고졸 신인 신화를 써 내려간 차민혁은 <a href="#" onclick="show('career2024');return false">2024 시즌</a> 마침내 롯데 자이언츠의 최연소 4번 타자라는 새로운 타이틀까지 거머쥐었다. 전년도보다 타율은 소폭 하락했지만, 중심 타선에서의 존재감은 더욱 커졌다. 시즌 내내 129안타, 19홈런, 76타점, 71득점, 7도루를 기록하며 타율 0.303, 장타율 0.515, 출루율 0.397, OPS 0.912를 남겼다.</p>
<p>시즌 초·중반에는 좌익수와 1루수를 번갈아 소화하며 팀의 주축 야수로 활약했다. 넓은 수비 범위를 바탕으로 여러 차례 호수비와 슈퍼캐치를 선보였고, 몸을 아끼지 않는 플레이로 외야 담장에 부딪히면서까지 타구를 걷어내는 장면도 여러 차례 연출했다. 그러나 시즌이 후반부로 접어들면서 누적된 체력 부담과 햄스트링 통증이 겹쳤고, 공격 생산성에도 조금씩 영향을 미치기 시작했다.</p>
<p>햄스트링 부상의 후유증이 남아 있던 가운데 1루 베이스를 밟는 과정에서 오른쪽 다리를 붙잡고 쓰러졌고, 2군에서 약 2주간 재활과 휴식을 거친 뒤 1군에 복귀했다. 결국 구단은 선수 보호를 위해 후반기부터 차민혁을 전면 지명타자로 기용하는 결단을 내렸다.</p>

career2025:`<h1>차민혁/선수 경력/2025년</h1><div class="meta">최근 수정 시각: 2026-09-28 00:57:00</div>
<h2>1. 개요</h2>
<p>롯데 자이언츠 소속 내야수 차민혁의 2025 시즌을 정리한 문서.</p>
<h2>2. 페넌트 레이스</h2>
<p><a href="#" onclick="show('career2025');return false">2025시즌</a>은 차민혁이 리그 최고의 타자로 완전히 자리매김한 시즌이다. 데뷔 3년 차를 맞은 그는 시즌 초반부터 압도적인 타격감을 과시하며 롯데 타선을 이끌었다. 전반기 동안 롯데가 정규시즌 3위까지 치고 올라가는 돌풍의 중심에는 언제나 차민혁이 있었으며, ‘차민혁의 2025년’이라는 평가를 받을 정도의 활약이었다.</p>
<p>정규시즌에서는 146경기에 출전해 162안타(1위), 36홈런(1위), 118타점(1위), 103득점(2위), 9도루, 98볼넷(1위)을 기록했다. 또한 타율 0.392(1위), 출루율 0.521(1위), 장타율 0.701(1위), OPS 1.222(1위)를 기록하며 리그 타격 지표를 사실상 지배했다.</p>
<p>다만 시즌 후반부에는 예상치 못한 변수가 찾아왔다. <span>99날</span> 이후 차민혁의 타격 페이스는 눈에 띄게 하락했다. 전반기까지 4할을 넘나들던 타율은 후반기 들어 급격히 떨어졌고, 출루율과 장타율 역시 함께 감소했다.</p>
<p>특히 99날 이후에는 <span>삼성 라이온즈</span>와의 모든 경기에서 선발 라인업에 이름을 올리지 않았다. 벤치에서 경기를 지켜보거나 경기 자체에 결장하는 경우가 이어졌으며, 결국 시즌 종료까지 삼성전 선발 출전 기록은 추가되지 않았다.</p>
<p>다만 <span>삼성전</span>을 완전히 결장한 것은 아니었다. 시즌 막판 단 두 차례 대타로 출전했는데, 첫 번째 타석에서는 2타점 적시타, 두 번째 타석에서는 3점 홈런을 터뜨리며 제한된 기회 속에서도 강렬한 존재감을 남겼다.</p>
<h2>3. 시즌 후</h2>
<p>이 시즌을 통해 타격왕, 홈런왕, 타점왕, 출루율왕, 장타율왕 등 5관왕을 달성했으며, 최고 지명타자 부문 골든글러브를 수상했다.</p>
<p>다만 정규시즌 MVP는 팀 성적의 영향을 받은 투표 결과 끝에 아쉽게도 수상에 실패했다. 차민혁 개인은 리그를 압도하는 성적을 남겼지만, 롯데는 후반기 12연패를 기록하며 한때 95%에 달했던 가을야구 진출 확률을 날려버렸고, 결국 정규시즌을 7위로 마감했다.</p>
<p>그럼에도 불구하고 차민혁은 데뷔 시즌의 ‘고졸 신인 신화’를 뛰어넘는 커리어하이를 작성하며 명실상부 KBO 최고의 타자로 자리매김했고, 리그를 대표하는 슈퍼스타라는 평가를 굳혔다.</p>
<h2>4. 총평</h2>
<h3>4.1. 페넌트 레이스 총평</h3>
<p><span>2025 KBO 리그</span> 최고의 선수이자 MVP로, 2025년을 넘어 2020년대 최고의 시즌 중 하나를 보냈다. 순수 세이버메트릭스상으로도 해당 시즌 최고의 선수였으며, 만 21세의 로컬보이 프랜차이즈 스타가 보여준 성적을 넘어 툴적인 면과 순수 기량에서 아예 약점이 없는 모습을 보여주며, 야구팬들에게 있어서 준 임팩트는 2020년대를 넘어 KBO 리그 역사상 가장 충격적인 시즌 중 하나로 거론된다.</p>
<p>2025년 이후 리그 최강의 유일무이 <span>삼나쌩</span>의 회장이 되었다. 삼성과 롯데의 맞대결이 모두 종료된 시점에서 2025년 동안의 삼성전 성적이 타율 0.486, 8홈런, 27타점, 출루율 0.596, 장타율 0.973, OPS 1.569로 삼성전은 그야말로 본즈 그 자체다. &gt; <span>차나씨</span> 문서 후술</p>

haeyang:`<h1>박해양</h1><div class="meta">최근 수정 시각: 2026-09-26</div><div class="toc"><b>목차</b><br>1. 개요<br>2. 선수 경력<br>3. 플레이 스타일<br>4. 별명<br>5. 광동과의 관계</div><h2>1. 개요</h2><p>삼성 라이온즈 소속의 투타겸업 선수. 선발 투수와 2루수를 오가며, KBO 유일의 좌완 언더핸드스로 투수라는 독특한 특징을 가지고 있다.</p><h2>2. 선수 경력</h2><p>광주동성초-선린중-서울고를 거쳐 2022 삼성 2라운드 1순위로 입단했다.</p><h2>3. 플레이 스타일</h2><p>좌완 언더핸드라는 희소한 투구폼을 기반으로 하며, 투타겸업 능력까지 갖춘 선수다.</p><h2>4. 별명</h2><p>해냥, 억냥, 야동, 줄리양, 억리양, 11억 투수, 박타니 냥헤이 등.</p><h2>5. 광동과의 관계</h2><p><a href="#" onclick="show('gwangdong');return false">광동</a>의 일원으로 <a href="#" onclick="show('cha');return false">차민혁</a>, <a href="#" onclick="show('doyoung');return false">김도영</a>과 2010년부터 이어진 친구 관계다.</p>`,

doyoung:`<div class="infobox"><div class="title">김도영</div><div class="photo" style="height:330px;padding:0;background:#fff"><img src="https://img2.yna.co.kr/etc/inner/EN/2024/10/21/AEN20241021006100315_01_i_P4.jpg" alt="김도영" style="width:100%;height:100%;object-fit:cover;object-position:center top"></div><table><tr><th>이름</th><td>김도영</td></tr><tr><th>출생</th><td>2003년 10월 2일 (22세)<br>광주광역시</td></tr><tr><th>학력</th><td>광주대성초 - 광주동성중 - 광주동성고</td></tr><tr><th>포지션</th><td>3루수, 유격수</td></tr><tr><th>투타</th><td>우투우타</td></tr><tr><th>프로 입단</th><td>2022년 1차 지명 (KIA)</td></tr><tr><th>소속팀</th><td>KIA 타이거즈 (2022~)</td></tr></table></div><h1>김도영</h1><div class="meta">최근 수정 시각: 2026-09-28</div><div class="toc"><b>목차</b><br>1. 개요<br>2. <a href='#' onclick="show('doyoungCareer');return false">선수 경력</a><br>2.1. <a href='#' onclick="show('doyoungAwards');return false">수상 경력 및 보유 기록</a><br>2.2. <a href='#' onclick="show('doyoungHR');return false">통산 홈런 일지</a><br>3. <a href='#' onclick="show('doyoungStyle');return false">플레이 스타일</a><br>4. 여담<br>5. 관련 문서</div><h2>1. 개요</h2><p>KIA 타이거즈 소속 내야수. 2024년 공격과 주루에서 두드러진 시즌을 보내며 KBO를 대표하는 젊은 선수 가운데 한 명으로 자리잡았다.</p><h2>2. 선수 경력</h2><p>2022년 KIA의 1차 지명을 받아 프로에 입단했다. 자세한 내용은 별도 선수 경력 문서에서 다룬다.</p><h2>3. 플레이 스타일</h2><p>빠른 배트 스피드와 장타력, 컨택, 주루 능력을 함께 갖춘 공격형 내야수로 평가된다.</p><h2>4. 여담</h2><p>광동의 구성원으로 설정되어 있으며 차민혁·박해양과 어린 시절부터 이어진 관계로 묘사된다.</p><h2>5. 관련 문서</h2><p><a href='#' onclick="show('gwangdong');return false">광동</a> · <a href='#' onclick="show('gyeongju');return false">경주즈</a></p>`,
doyoungCareer:`<h1>김도영/선수 경력</h1><div class="meta">최근 수정 시각: 2026-09-28</div><div class="toc"><b>목차</b><br>1. 개요<br>2. 아마추어 시절<br>3. KIA 타이거즈<br>3.1. 2022 시즌<br>3.2. 2023 시즌<br>3.3. 2024 시즌<br>3.4. 2025 시즌<br>3.5. 2026 시즌<br>4. 국가대표 경력</div><h2>1. 개요</h2><p>KIA 타이거즈 소속 내야수 김도영의 선수 경력을 정리한 문서.</p><h2>2. 아마추어 시절</h2><p>광주대성초-광주동성중-광주동성고를 거쳤으며 고교 시절 상위 지명 후보로 평가받았다.</p><h2>3. KIA 타이거즈</h2><h3>3.1. 2022 시즌</h3><p>프로 데뷔 시즌. 103경기에서 타율 .237, 3홈런, 13도루를 기록했다.</p><h3>3.2. 2023 시즌</h3><p>84경기에서 타율 .303, 7홈런, 25도루를 기록했다.</p><h3>3.3. 2024 시즌</h3><div class="awardbox"><div class="award-title">2024 주요 기록</div><div class="award-item">월간 10-10 최초</div><div class="award-item">30-30 최연소·최소 경기</div><div class="award-item">38홈런 40도루 · 143득점</div><div class="award-item">KBO 정규시즌 MVP · 3루수 골든글러브</div></div><p>141경기 타율 .347, 38홈런, 109타점, 143득점, 40도루를 기록했다.</p><h3>3.4. 2025 시즌</h3><p>부상으로 시즌 전체를 정상 소화하지 못했으나 복귀 후 타격과 주루에서 존재감을 보였다.</p><h3>3.5. 2026 시즌</h3><p>2026 시즌에도 KIA의 중심 내야수로 활약 중이다.</p><h2>4. 국가대표 경력</h2><p>2021 U-23, 2023 APBC, 2024 프리미어 12, 2026 WBC 및 2026 아시안 게임 관련 대표팀 경력을 갖고 있다.</p>`,
doyoungAwards:`<h1>김도영/수상 경력 및 보유 기록</h1><div class="meta">최근 수정 시각: 2026-09-28</div><h2>1. 개요</h2><p>김도영의 주요 수상 경력과 KBO 리그 기록을 정리한 문서.</p><h2>2. 주요 수상</h2><table class="wikitable"><tr><th>연도</th><th>수상</th></tr><tr><td>2024</td><td>KBO 올스타 · 3루수 골든글러브 · KBO 정규시즌 MVP</td></tr><tr><td>2025</td><td>KBO 올스타 등</td></tr></table><h2>3. 주요 기록</h2><table class="wikitable"><tr><th>달성 시기</th><th>기록</th><th>내용</th></tr><tr><td>2024.04.25</td><td>월간 10-10</td><td>역대 최초</td></tr><tr><td>2024.07.23</td><td>사이클링 히트</td><td>최연소권</td></tr><tr><td>2024.08.15</td><td>30-30</td><td>최연소·최소 경기</td></tr><tr><td>2024.09.08</td><td>100타점-100득점</td><td>최연소</td></tr></table>`,
doyoungHR:`<h1>김도영/통산 홈런 일지</h1><div class="meta">김도영의 통산 홈런 기록을 정리한 문서.</div><h2>1. 시즌별 홈런</h2><table class="wikitable"><tr><th>시즌</th><th>홈런</th></tr><tr><td>2022</td><td>3</td></tr><tr><td>2023</td><td>7</td></tr><tr><td>2024</td><td class="hr-max">38</td></tr><tr><td>2025</td><td>7</td></tr><tr><td>2026</td><td>시즌 진행 중</td></tr></table>`,
doyoungStyle:`<h1>김도영/플레이 스타일</h1><div class="meta">김도영의 타격·주루·수비 스타일을 정리한 문서.</div><h2>1. 개요</h2><p>장타와 컨택을 동시에 노릴 수 있는 공격형 내야수다.</p><h2>2. 타격</h2><p>빠른 배트 스피드와 강한 타구 생산이 특징이다.</p><h2>3. 주루</h2><p>주력과 스타트가 좋아 도루와 추가 진루에서 강점을 보인다.</p><h2>4. 수비</h2><p>3루와 유격수 수비를 경험했다.</p>`,
jaehyun:`<div class="infobox"><div class="title">이재현</div><table><tr><th>출생</th><td>2003년 2월 4일</td></tr><tr><th>학력</th><td>서울이수초 - 선린중 - 서울고</td></tr><tr><th>포지션</th><td>유격수</td></tr><tr><th>투타</th><td>우투우타</td></tr><tr><th>프로 입단</th><td>2022년 삼성 라이온즈 1차 지명</td></tr><tr><th>소속팀</th><td>삼성 라이온즈 (2022~)</td></tr></table></div><h1>이재현</h1><div class="meta">최근 수정 시각: 2026-09-28</div><div class="toc"><b>목차</b><br>1. 개요<br>2. 선수 경력<br>3. 플레이 스타일<br>4. 차민혁과의 관계<br>5. 여담<br>6. 관련 문서</div><h2>1. 개요</h2><p>삼성 라이온즈 소속 유격수. 서울고 시절 뛰어난 수비와 준수한 타격으로 이름을 알렸고 2022년 삼성의 1차 지명을 받았다.</p><h2>2. 선수 경력</h2><p>안산 관산초에서 야구를 시작해 서울 이수초, 선린중, 서울고를 거쳤다. 프로 데뷔 후 삼성의 젊은 내야 자원으로 성장했다.</p><h2>3. 플레이 스타일</h2><p>유격수 수비에서 안정적인 풋워크와 송구를 보여주며 타격에서도 장타 생산을 늘려가는 유형이다.</p><h2>4. 차민혁과의 관계</h2><p>차민혁과 또래 선수로 분류되며 이 세계관에서는 경기장 안팎에서 친분을 이어가는 관계로 설정되어 있다.</p><h2>5. 여담</h2><p>2022년 삼성의 1차 지명은 2009년 김상수 이후 오랜만의 야수 1차 지명이었다.</p><h2>6. 관련 문서</h2><p><a href='#' onclick="show('cha');return false">차민혁</a> · <a href='#' onclick="show('gyeongju');return false">경주즈</a></p>`,

gwangdong:`<h1>광동</h1><div class="meta">최근 수정 시각: 2026-09-28</div><div class="notice"><b>광동업!</b><br>광동의 우정을 시험하지 마라.</div><h2>1. 개요</h2><p>2010년 광주동성초등학교에 입학한 김도영, 박해양, 차민혁 세 명의 친구를 지칭하는 말이다.</p><h2>2. 구성원</h2><table class="wikitable"><tr><th>이름</th><th>설정</th></tr><tr><td><a href='#' onclick="show('doyoung');return false">김도영</a></td><td>KIA 타이거즈</td></tr><tr><td><a href='#' onclick="show('haeyang');return false">박해양</a></td><td>삼성 라이온즈</td></tr><tr><td><a href='#' onclick="show('cha');return false">차민혁</a></td><td>롯데 자이언츠</td></tr></table><h2>3. 용어</h2><p>광우시(광동의 우정을 시험하지 마라), 광투완(광동 투표 완료).</p><h2>4. 경주즈와의 관계</h2><p>경주즈와 일부 구성원이 겹치지만 두 명칭은 별개의 관계권이다.</p>`,

gyeongju:`<h1>경주즈</h1><div class="meta">최근 수정 시각: 2026-09-28</div><div class="notice"><b>2020 올스타 캠프 경주 모임</b><br>2020년 8월 8일 경주에서 함께 시간을 보낸 10명의 선수들을 가리키는 명칭.</div><div class="toc"><b>목차</b><br>1. 개요<br>2. 구성원<br>3. 광동과의 관계<br>4. 여담</div><h2>1. 개요</h2><p>2020년 올스타 캠프 당시 경주에서 함께 시간을 보낸 선수들을 묶어 부르는 비공식 명칭이다.</p><h2>2. 구성원</h2><table class="wikitable"><tr><th>선수</th><th>구단</th></tr><tr><td><a href='#' onclick="show('jaehyun');return false">이재현</a></td><td>삼성 라이온즈</td></tr><tr><td><a href='#' onclick="show('josejin');return false">조세진</a></td><td>롯데 자이언츠</td></tr><tr><td><a href='#' onclick="show('cha');return false">차민혁</a></td><td>롯데 자이언츠</td></tr><tr><td><a href='#' onclick="show('hantaeyang');return false">한태양</a></td><td>롯데 자이언츠</td></tr><tr><td><a href='#' onclick="show('moon');return false">문동주</a></td><td>한화 이글스</td></tr><tr><td><a href='#' onclick="show('haeyang');return false">박해양</a></td><td>삼성 라이온즈</td></tr><tr><td><a href='#' onclick="show('donghee');return false">윤동희</a></td><td>롯데 자이언츠</td></tr><tr><td><a href='#' onclick="show('doyoung');return false">김도영</a></td><td>KIA 타이거즈</td></tr><tr><td><a href='#' onclick="show('minseok');return false">이민석</a></td><td>롯데 자이언츠</td></tr><tr><td><a href='#' onclick="show('youngwoong');return false">김영웅</a></td><td>삼성 라이온즈</td></tr></table><h2>3. 광동과의 관계</h2><p><a href='#' onclick="show('gwangdong');return false">광동</a>은 경주즈와 겹치는 구성원이 있는 별도의 관계권이다.</p><h2>4. 여담</h2><p>공식 팀이나 단체명이 아닌 이 세계관의 비공식적인 모임 이름이다.</p>`,
josejin:`<div class="infobox"><div class="title">조세진</div><table><tr><th>포지션</th><td>외야수</td></tr><tr><th>투타</th><td>우투좌타</td></tr><tr><th>프로 입단</th><td>2022년 2차 1라운드</td></tr><tr><th>소속팀</th><td>롯데 자이언츠</td></tr></table></div><h1>조세진</h1><h2>1. 개요</h2><p>롯데 자이언츠 소속 외야수. 고교 시절 타격 능력을 바탕으로 상위권 유망주로 평가받았고 2022년 롯데에 입단했다.</p><h2>2. 아마추어 시절</h2><p>북일고에서 투타를 병행하다 서울고로 전학한 뒤 야수에 집중했다. 3학년 때 높은 타율과 장타 생산을 기록했다.</p><h2>3. 프로 경력</h2><p>상무 복무 후 롯데에서 다시 경쟁을 이어갔으며 2024년 KBO 퓨처스 올스타전 MVP 수상 경력이 있다.</p><h2>4. 경주즈</h2><p><a href='#' onclick="show('gyeongju');return false">경주즈</a>의 구성원.</p>`,

function show(key){
  document.getElementById('content').innerHTML=pages[key]||pages.home;
  applyFootnoteTooltips();
  decorateStars();
  window.scrollTo({top:0,behavior:'smooth'});
  history.replaceState(null,'','#'+key);
}
function toggleMore(){const b=document.getElementById("moreBody");if(b)b.classList.toggle("open")}

function toggleInfoMore(){
  const body=document.getElementById('infoMoreBody');
  const t=document.getElementById('infoMoreToggle');
  if(!body)return;
  body.classList.toggle('open');
  if(t)t.textContent=body.classList.contains('open')?'[접기]':'[펼치기]';
}
function decorateStars(){const root=document.getElementById('content');if(!root)return;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(n=>{if(!n.nodeValue.includes('*'))return;const frag=document.createDocumentFragment();let rest=n.nodeValue;while(rest){const m=rest.match(/\*([^*]+)\*/);if(!m){frag.appendChild(document.createTextNode(rest));break;}const before=rest.slice(0,m.index);if(before)frag.appendChild(document.createTextNode(before));const a=document.createElement('a');a.className='starlink';a.href='#';a.textContent=m[1];a.onclick=()=>false;frag.appendChild(a);rest=rest.slice(m.index+m[0].length);}n.parentNode.replaceChild(frag,n);});}

function applyFootnoteTooltips(){
  document.querySelectorAll('.fn a[href^="#fn"]').forEach(a=>{
    const id=a.getAttribute('href').slice(1);
    const target=document.getElementById(id);
    if(target)a.setAttribute('data-note',target.textContent.replace(/^\\[\\d+\\]\\s*/,'').trim());
  });
}
